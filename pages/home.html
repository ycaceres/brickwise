<!-- Home: the account, then the planned workouts of a day -->
<div id="tab-home" class="tab hidden">
  <bw-user-card class="card hidden"></bw-user-card>
  <section class="card hidden" id="hLogin">
    <h2>Intervals.icu</h2>
    <p class="note">Sign in with your API key in <button class="link" id="hGoProfile">Profile</button> to see your account and planned workouts.</p>
  </section>

  <section class="card">
    <h2>Planned workouts</h2>
    <div class="home-filters">
      <label class="field">Day
        <input type="date" id="hDate">
      </label>
      <label class="field">Sport
        <select id="hSport">
          <option value="all">All</option>
          <option value="run">🏃 Run</option>
          <option value="ride">🚴 Ride</option>
        </select>
      </label>
      <button class="icon" id="hReload" aria-label="Reload the day" title="Reload the day"><bw-icon name="refresh"></bw-icon></button>
    </div>
    <bw-workout-list class="wlist" id="hPlanned"></bw-workout-list>
  </section>
</div>
