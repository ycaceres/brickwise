<!-- Debug (only with ?debug=true): controllable state and log -->
<div id="tab-debug" class="tab hidden">
  <section class="card">
    <h2 data-i18n="debug.devices">Devices</h2>
    <!-- One block per connected treadmill / trainer: normalized readings, then the driver's own rows -->
    <div id="devTables"><p class="note">No device connected.</p></div>
    <div class="note mt-10" id="cInfo">No equipment info yet.</div>
  </section>
  <section class="card">
    <details open>
      <summary data-i18n="debug.communicationLog">Communication log</summary>
      <div class="row my-10">
        <label class="row note"><input type="checkbox" id="logTraffic" class="check"> <span data-i18n="debug.showTraffic">Show TX/RX packets</span></label>
        <button id="btnLogDownload" data-i18n="debug.downloadLog">Download log</button>
      </div>
      <div class="log" id="log"></div>
    </details>
  </section>
</div>
